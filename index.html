<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSP removed to fix JavaScript blocking issues -->
    <title>Trumpet Trainer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎺</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <style>
        :root {
            /* Light theme colors */
            --primary-orange: #ff6b35;
            --primary-teal: #00b4d8;
            --primary-blue: #0077b6;
            --background: #ffffff;
            --surface: #f8f9fa;
            --text-primary: #212529;
            --text-secondary: #6c757d;
            --border: #dee2e6;
            --shadow: rgba(0, 0, 0, 0.1);
            --card-bg: #ffffff;
            --nav-bg: rgba(255, 255, 255, 0.95);
        }

        .dark {
            /* Dark theme colors */
            --background: #0d1117;
            --surface: #161b22;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --border: #30363d;
            --shadow: rgba(0, 0, 0, 0.3);
            --card-bg: #21262d;
            --nav-bg: rgba(13, 17, 23, 0.95);
        }

        /* Global Navigation Bar */
        .nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 1rem;
            text-decoration: none;
            color: var(--text-primary);
        }

        .nav-logo {
            height: 40px;
            width: auto;
        }

        .brand-text {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--bad));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-brand img {
            height: 2rem;
            width: auto;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .free-class-btn {
            background: linear-gradient(135deg, var(--accent) 0%, var(--bad) 100%);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .free-class-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(32, 156, 189, 0.3);
        }

        .theme-toggle {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            position: relative;
            overflow: hidden;
        }

        .theme-toggle::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.3s ease;
        }

        .theme-toggle:hover::before {
            left: 100%;
        }

        .theme-toggle:hover {
            background: linear-gradient(135deg, var(--accent) 0%, var(--bad) 100%);
            color: white;
            border-color: transparent;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(32, 156, 189, 0.3);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .nav {
                padding: 1rem;
            }

            .nav-brand {
                font-size: 1.25rem;
            }
        }

        /* Mobile-First Mobile Styles */
        @media (max-width: 768px) {
            /* Mobile Navigation */
            .nav {
                padding: 0.75rem 1rem;
                flex-direction: column;
                gap: 0.75rem;
                height: auto;
                min-height: 80px;
            }

            .nav-controls {
                flex-wrap: wrap;
                justify-content: center;
                gap: 0.5rem;
            }

            .free-class-btn {
                padding: 0.75rem 1rem;
                font-size: 0.9rem;
                min-width: 80px;
                text-align: center;
            }

            .theme-toggle {
                width: 44px;
                height: 44px;
                min-width: 44px;
            }

            /* Mobile Game Layout */
            #board {
                width: 100%;
                max-width: 100%;
                padding: 1rem;
                box-sizing: border-box;
                position: relative;
            }

            .brand-logo {
                height: 3rem;
                margin-bottom: 1rem;
            }

            /* Mobile HUD */
            #hud {
                width: 100%;
                grid-template-columns: 1fr;
                justify-items: center;
                gap: 0.75rem;
                margin-top: 0.5rem;
            }

            #valves {
                gap: 0.5rem;
                justify-content: center;
                width: 100%;
            }

            #stats {
                justify-content: center;
                gap: 0.5rem;
                width: 100%;
            }

            /* Mobile Overlay */
            #overlay {
                padding: 1rem;
            }

            #overlay .card {
                padding: 1.5rem;
                margin: 1rem;
                max-width: 100%;
                border-radius: 16px;
            }

            #overlay h1 {
                font-size: 1.75rem;
                margin-bottom: 0.75rem;
            }

            #overlay p {
                font-size: 1rem;
                margin-bottom: 1rem;
            }

            /* Mobile Chips */
            .chips {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 0.5rem;
                margin: 1rem 0;
            }

            .chip {
                padding: 0.75rem;
                font-size: 0.9rem;
                text-align: center;
                border-radius: 8px;
            }

            /* Mobile Difficulty Selector */
            .difficulty-selector {
                flex-direction: column;
                gap: 1rem;
                margin: 1rem 0;
            }

            .difficulty-selector > div {
                width: 100%;
            }

            .difficulty-selector label {
                display: block;
                margin-bottom: 0.5rem;
                font-weight: 500;
            }

            .difficulty-selector select {
                width: 100%;
                padding: 0.75rem;
                border-radius: 8px;
                border: 1px solid var(--border);
                background: var(--surface);
                color: var(--text-primary);
                font-size: 1rem;
            }

            /* Mobile Buttons */
            .cta, #startBtn {
                width: 100%;
                padding: 1rem;
                font-size: 1.1rem;
                border-radius: 12px;
                min-height: 56px;
            }

            /* Mobile VexFlow Canvas */
            #vf {
                width: 100% !important;
                height: auto !important;
                max-height: 230px;
                overflow: hidden;
            }

            /* Mobile Theme Toggle */
            #themeToggle {
                position: absolute;
                top: 0.5rem;
                left: 0.5rem;
                width: 36px;
                height: 36px;
                z-index: 10;
            }
        }

        /* Extra Small Mobile Devices */
        @media (max-width: 480px) {
            .global-nav {
                padding: 0.5rem;
            }

            .nav-brand {
                font-size: 1.1rem;
            }

            .nav-controls {
                gap: 0.25rem;
            }

            .free-class-btn {
                padding: 0.5rem 0.75rem;
                font-size: 0.8rem;
                min-width: 70px;
            }

            #board {
                padding: 0.5rem;
            }

            .chips {
                grid-template-columns: 1fr;
            }

            #overlay .card {
                padding: 1rem;
                margin: 0.5rem;
            }
        }

        /* Landscape Mobile */
        @media (max-width: 768px) and (orientation: landscape) {
            .global-nav {
                flex-direction: row;
                height: 60px;
                min-height: 60px;
            }

            #hud {
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 1rem;
            }

            #valves {
                max-width: none;
            }

            #stats {
                max-width: none;
                justify-content: flex-start;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
  </head>
  <body>
    <!-- Global Navigation Bar -->
    <nav class="nav">
        <a href="index.html" class="nav-brand">
            <img id="nav-logo" src="Untitled design.svg" alt="Logo" onerror="this.style.display='none'" class="nav-logo">
            <span class="brand-text">Trumpet Trainer</span>
        </a>
        <div class="nav-controls">
            <a href="https://toot-your-own-horn.com/landing-page-page" class="free-class-btn" target="_blank" rel="noopener noreferrer">🎓 Free Trumpet Class</a>
        </div>
    </nav>

    <main id="app">
      <div id="board">
        <button id="quickResetBtn" class="board-reset hidden" type="button" aria-label="Reset current round">Reset</button>
        <div id="vf"></div>
        <div id="learningHint" class="learning-hint hidden" aria-live="polite"></div>
        <div id="hud">
          <div id="stats"></div>
          <div id="valves"></div>
        </div>
      </div>

      <section id="overlay" aria-live="polite">
        <div class="card">
          <img class="brand-logo" alt="Trumpet Trainer Logo" src="Untitled design.svg" />
          <h1 id="title">Trumpet Trainer</h1>
          <div class="chips">
            <span class="chip">1 = ←</span>
            <span class="chip">2 = ↓</span>
            <span class="chip">3 = →</span>
            <span class="chip">0 = ↑ / Enter</span>
            <span class="chip">Start/Pause = Space</span>
            <span class="chip">Reset = R</span>
          </div>
          
          <div class="difficulty-selector">
            <div>
              <label for="difficulty">Difficulty:</label>
              <select id="difficulty">
                <option value="normal">Normal (F#3 - C6)</option>
                <option value="lead">Lead Trumpet (F#3 - G6)</option>
                <option value="hard">Hard Mode (F#3 - G6 + Double Accidentals)</option>
                <option value="doublec">Double C (F#3 - C7)</option>
                <option value="ultra">Ultra Hard (F#3 - C7 + Double Accidentals)</option>
              </select>
            </div>
            <div>
              <label for="timeMode">Time:</label>
              <select id="timeMode">
                <option value="60s" selected>60s</option>
                <option value="30s">30s</option>
                <option value="120s">120s</option>
                <option value="endless">Endless (5 lives)</option>
              </select>
            </div>
            <div>
              <label for="learningMode">Learning:</label>
              <select id="learningMode">
                <option value="off" selected>Off</option>
                <option value="name">Note Name</option>
                <option value="name+fingering">Name + Fingering</option>
              </select>
            </div>
          </div>
          <div class="start-section">
            <button id="startBtn" class="cta">Start 60s Round</button>
          </div>
          <div id="cta" class="hint"></div>
        </div>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
  </html>
