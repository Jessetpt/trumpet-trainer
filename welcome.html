<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trumpet Trainer - Free Note ID Game</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎺</text></svg>">
    <link rel="stylesheet" href="styles.css">
    <style>
        :root {
            --primary-teal: #209cbd;
            --primary-orange: #f68318;
            --surface: #ffffff;
            --surface-dark: #1a1a1a;
            --text-primary: #000000;
            --text-primary-dark: #ffffff;
            --text-secondary: #666666;
            --text-secondary-dark: #cccccc;
            --border: #e0e0e0;
            --border-dark: #333333;
            --accent: #209cbd;
            --accent-dark: #17a8d1;
        }

        .dark {
            --surface: var(--surface-dark);
            --text-primary: var(--text-primary-dark);
            --text-secondary: var(--text-secondary-dark);
            --border: var(--border-dark);
            --accent: var(--accent-dark);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: var(--surface);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 1rem;
            text-decoration: none;
            color: var(--text-primary);
        }

        .nav-logo {
            height: 40px;
            width: auto;
        }

        .brand-text {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-teal), var(--primary-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .nav-btn {
            background: linear-gradient(135deg, var(--primary-teal) 0%, var(--primary-orange) 100%);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(32, 156, 189, 0.3);
        }

        .theme-toggle {
            background: var(--surface);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 0.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .theme-toggle:hover {
            background: linear-gradient(135deg, var(--primary-teal) 0%, var(--primary-orange) 100%);
            color: white;
            border-color: transparent;
        }

        .main-content {
            flex: 1;
            max-width: 600px;
            margin: 0 auto;
            padding: 3rem 2rem;
            text-align: center;
        }

        .hero-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .hero-subtitle {
            font-size: 1.25rem;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        .signup-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .signup-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-group {
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-group input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            background: var(--surface);
            color: var(--text-primary);
            transition: border-color 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-teal);
        }

        .cta-button {
            background: linear-gradient(135deg, var(--primary-orange), var(--primary-teal));
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-size: 1.125rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(246, 131, 24, 0.3);
            margin-top: 0.5rem;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(246, 131, 24, 0.4);
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 2.5rem;
            flex-wrap: wrap;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .feature-icon {
            color: var(--primary-teal);
        }

        .footer-links {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }

        .footer-links a {
            color: var(--primary-teal);
            text-decoration: none;
            margin: 0 1rem;
            font-weight: 500;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .hero-title {
                font-size: 2rem;
            }
            .hero-subtitle {
                font-size: 1.1rem;
            }
            .features {
                flex-direction: column;
                gap: 1rem;
                align-items: center;
            }
            .nav {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="welcome.html" class="nav-brand">
            <img src="Untitled design.svg" alt="Trumpet Trainer" class="nav-logo">
            <span class="brand-text">Trumpet Trainer</span>
        </a>
        <div class="nav-controls">
            <a href="free-class.html" class="nav-btn">Free Class</a>
            <button class="theme-toggle" id="themeToggle" title="Toggle theme">
                <span id="themeIcon">🌙</span>
            </button>
        </div>
    </nav>

    <main class="main-content">
        <h1 class="hero-title">Master Trumpet Note Reading</h1>
        <p class="hero-subtitle">Test your skills with our free note identification game. Multiple difficulty levels from beginner to Double C range.</p>

        <div class="signup-card">
            <form class="signup-form" id="signupForm">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" required placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>
                <button type="submit" class="cta-button">Start Playing Free</button>
            </form>
        </div>

        <div class="features">
            <div class="feature">
                <span class="feature-icon">🎯</span>
                <span>5 Difficulty Levels</span>
            </div>
            <div class="feature">
                <span class="feature-icon">⏱️</span>
                <span>Timed Rounds</span>
            </div>
            <div class="feature">
                <span class="feature-icon">🎹</span>
                <span>Valve Fingering Practice</span>
            </div>
        </div>

        <div class="footer-links">
            <a href="free-class.html">Free Trumpet Class</a>
            <a href="book-chat.html">Book a Chat</a>
        </div>
    </main>

    <script src="theme.js"></script>
    <script>
        // Check if already signed up - go straight to game
        const player = localStorage.getItem('playerInfo');
        if (player) {
            window.location.href = 'index.html';
        }

        // Handle form submission
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();

            if (name && email) {
                // Store player info
                const playerInfo = {
                    name: name,
                    email: email,
                    signedUpAt: new Date().toISOString()
                };
                localStorage.setItem('playerInfo', JSON.stringify(playerInfo));

                // Go to game
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
